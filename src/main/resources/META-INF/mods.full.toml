modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="custom_glint.iceandfire.mixins.json"
[[mixins]]
config="custom_glint.epicknights.mixins.json"
[[mixins]]
config="custom_glint.sophisticatedbackpacks.mixins.json"
[[mixins]]
config="custom_glint.epicfight.mixins.json"
[[mixins]]
config="custom_glint.geckolib.mixins.json"
[[mixins]]
config="custom_glint.immersivearmors.mixins.json"
[[mixins]]
config="custom_glint.mekanism.mixins.json"
[[mixins]]
config="custom_glint.artifacts.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="customglint.png"
logoBlur=false
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="customglint_api"
    mandatory=true
    versionRange="[${mod_version},${api_next_major}.0)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[15.20,)"
    ordering="NONE"
    side="CLIENT"
