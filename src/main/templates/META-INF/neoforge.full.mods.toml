modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/TunaMods/custom_glint/issues"

# Standalone-only compat mixins (not in the api jar). Soft compat: @Pseudo targets, no-op when the mod is absent.
[[mixins]]
config="custom_glint.sophisticatedbackpacks.mixins.json"
[[mixins]]
config="custom_glint.artifacts.mixins.json"

# --- Full mod ---
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="customglint.png"
authors="${mod_authors}"
description='''${mod_description}'''

# customglint_api is resolved at runtime from the nested jar in META-INF/jarjar/.
[[dependencies.${mod_id}]]
    modId="customglint_api"
    type="required"
    versionRange="[${mod_version},${api_next_major}.0)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.0,)"
    ordering="NONE"
    side="CLIENT"
