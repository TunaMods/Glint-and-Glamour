plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven {
        // JEI
        name = 'Jared maven'
        url = 'https://maven.blamejared.com/'
    }
}

base {
    // Player-facing downloadable jar name. Display name is "Glint & Glamour"; filenames can't hold '&',
    // so hyphenate. The api jar has its own archiveBaseName 'glint-and-glamour-api' below. The mod id
    // (customglint) is unchanged — only the public name is.
    archivesName = 'Glint-and-Glamour'
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI — API on the compile classpath, full artifact at runtime only (not published as a dependency).
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// --------------------------------------------------------------------------------------------
// Two-jar split: api jar (consumed via jarJar) + full jar (Modrinth standalone download).
//
// apiJar packages only common/** + the core mixin config + AT + glint textures + an api-only
// neoforge.mods.toml. This is what downstream mods bundle via jarJar — no wand, no tab, no
// recipes, no compat mixins.
//
// jar (the full standalone) excludes the api content (so api classes only ever exist in one
// place at runtime — inside the nested api jar), swaps in a full-only neoforge.mods.toml, and
// self-bundles the api jar under META-INF/jarjar/ with a generated metadata.json. A player who
// installs only the full jar still gets the api loaded.
//
// No reobf: NeoForge 1.21.1 runs on official Mojang mappings, so there is no SRG step and no
// refmap to stage (Mixin treats the absent refmap as identity, which is correct under Mojmap).
// --------------------------------------------------------------------------------------------

def apiJarName = "glint-and-glamour-api-${mod_version}.jar"
def modMetadataDir = layout.buildDirectory.dir("generated/sources/modMetadata/META-INF")

def apiJarTask = tasks.register('apiJar', Jar) {
    archiveBaseName = 'glint-and-glamour-api'
    // Tag the built file with the MC version to tell it apart from the 1.21.1 build locally. This is
    // only the build/libs filename; the maven publication and the jarjar nesting both rename it back
    // to glint-and-glamour-api-${mod_version}.jar, so the published coordinate stays the bare version.
    archiveVersion = "${mod_version}-${minecraft_version}"
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn 'classes', 'processResources', generateModMetadata

    from(sourceSets.main.output) {
        include 'net/tunamods/customglint/common/**'
        include 'META-INF/accesstransformer.cfg'
        include 'custom_glint.mixins.json'
        include 'assets/customglint/textures/glint/**'
        // The pipelines in common/client are the only thing that loads these, so they ship with the
        // api half. Without them a client that has the api on its path dies in the first resource
        // reload on customglint:pipeline/glow_outline_id.
        include 'assets/customglint/shaders/**'
        // Client rendering config labels live here — ship them so embedders' config screen isn't raw keys.
        include 'assets/customglint/lang/**'
        include 'customglint.png'
        include 'pack.mcmeta'
    }

    // api-only metadata, renamed into place
    from(modMetadataDir) {
        include 'neoforge.api.mods.toml'
        into 'META-INF'
        rename '.+', 'neoforge.mods.toml'
    }
}

// Generate the jarjar metadata.json that FML reads to register the nested api jar.
// Config-cache safe: doLast touches only captured locals + the output file, never `project`.
def generateApiJarJarMetadata = tasks.register('generateApiJarJarMetadata') {
    def outFile = layout.buildDirectory.file('jarjar-meta/metadata.json')
    def versionStr = mod_version.toString()
    def groupStr = mod_group_id.toString()
    def nestedName = apiJarName
    // Track these as inputs so a version/group/name change re-runs the task. Without them the task has
    // only an output and Gradle keeps a stale metadata.json across a version bump — which then declares a
    // nested api jar version that no longer matches the embedded file (FML: "declares X but does not
    // contain it").
    inputs.property('version', versionStr)
    inputs.property('group', groupStr)
    inputs.property('nestedName', nestedName)
    outputs.file outFile
    doLast {
        def f = outFile.get().asFile
        f.parentFile.mkdirs()
        f.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                jars: [[
                        identifier  : [group: groupStr, artifact: 'glint-and-glamour-api'],
                        version     : [range: "[${versionStr},2.0)".toString(), artifactVersion: versionStr],
                        path        : "META-INF/jarjar/${nestedName}".toString(),
                        isObfuscated: false
                ]]
        ]))
    }
}

tasks.named('jar', Jar).configure {
    dependsOn generateModMetadata
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Tag the standalone download with the MC version so it doesn't collide with the
    // 1.21.1 build, which shares the same mod_version. The nested api jar keeps the plain
    // version (embedders pin it by maven coordinate).
    archiveVersion = "${mod_version}-${minecraft_version}"

    // Api content lives inside the nested api jar only — drop it from the full jar so classes
    // aren't loaded twice when a downstream mod's bundled jarJar copy also resolves.
    exclude 'net/tunamods/customglint/common/**'
    exclude 'META-INF/accesstransformer.cfg'
    exclude 'custom_glint.mixins.json'
    exclude 'assets/customglint/textures/glint/**'
    exclude 'assets/customglint/shaders/**'
    // The dev neoforge.mods.toml declares both mods + all mixins; the full jar uses its own.
    exclude 'META-INF/neoforge.mods.toml'
    exclude 'META-INF/neoforge.api.mods.toml'
    exclude 'META-INF/neoforge.full.mods.toml'
    // Stale Forge-format metadata that NeoForge ignores — keep it out of the shipped jar.
    exclude 'META-INF/mods.toml'
    exclude 'META-INF/mods.api.toml'
    exclude 'META-INF/mods.full.toml'
    exclude 'META-INF/MANIFEST.MF'

    // full-only metadata, renamed into place
    from(modMetadataDir) {
        include 'neoforge.full.mods.toml'
        into 'META-INF'
        rename '.+', 'neoforge.mods.toml'
    }

    // nest the api jar + its jarjar metadata
    from(apiJarTask.flatMap { it.archiveFile }) {
        into 'META-INF/jarjar'
        rename '.+', apiJarName
    }
    from(generateApiJarJarMetadata) {
        into 'META-INF/jarjar'
    }
}

// Publishing: the full standalone jar plus the api jar embedders bundle via jarJar.
// The api jar goes to the in-repo raw maven (mcmodsrepo) that downstream mods point jarJar at.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'glint-and-glamour'
            artifact jar
        }
        register('mavenJavaApi', MavenPublication) {
            artifactId = 'glint-and-glamour-api'
            artifact apiJar
        }
    }
    repositories {
        maven {
            // file().toURI() yields a valid file:/// URI on Windows; the bare "file://${projectDir}"
            // form mixes back/forward slashes and fails under Gradle's configuration cache.
            url = file("mcmodsrepo").toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
