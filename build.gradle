buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        // MixinGradle bridges the Mixin annotation processor to ForgeGradle's SRG pipeline so the
        // generated refmap actually contains entries (e.g. fixedBuffers → f_110093_). Without it the
        // -AoutRefMapFile compiler arg writes a syntactically valid but EMPTY refmap, leaving @Shadow
        // fields unresolvable in SRG/production runtime.
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// MixinGradle must be applied AFTER ForgeGradle. It queries FG's reobf tasks at apply time.
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    // Player-facing downloadable jar name. Display name is "Glint & Glamour"; filenames can't hold '&',
    // so hyphenate. The API jar has its own archiveBaseName 'glint-and-glamour-api' below. That is the
    // jarJar / maven coordinate downstream mods depend on; keep the two in sync if renamed again.
    archivesName = 'Glint-and-Glamour'
}
// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Tell Mixin to remap the refmap from SRG → MCP (deobf) at runtime in dev. Without
            // these, our SRG-named refmap entries don't match dev field/method names and shadows
            // silently fail in runClient just like they did in prod with an empty refmap.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Blamejared Maven"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "SpongePowered Maven"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
}

// Registers the refmap with MixinGradle so it is generated by the annotation processor (with real
// SRG mappings) and reobfuscated into the final jar. Replaces the manual -AoutRefMapFile arg.
mixin {
    add sourceSets.main, 'custom_glint.mixins.refmap.json'
    config 'custom_glint.mixins.json'
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// --------------------------------------------------------------------------------------------
// Two-jar split: api jar (consumed via jarJar) + full jar (Modrinth standalone download).
//
// apiJar packages only common/* + mixin config + AT + glint textures + mods.api.toml renamed to
// META-INF/mods.toml. This is what downstream mods bundle via jarJar: no wand, no tab, no recipes.
//
// jar (the full standalone) excludes the api content (so api classes only ever exist in one
// place at runtime, inside the nested api jar) and self-bundles the api jar via
// META-INF/jarjar/, so a player who installs only the full jar still gets the api loaded.
// --------------------------------------------------------------------------------------------

def apiJarName = "glint-and-glamour-api-${mod_version}.jar"

tasks.register('apiJar', Jar) {
    archiveBaseName = 'glint-and-glamour-api'
    // Tag the built file with the MC version to tell it apart from the 1.21.1 and 26.1.2 builds, which
    // share the same mod_version. This is only the build/libs filename; the maven publication and the
    // jarjar nesting both rename it back to glint-and-glamour-api-${mod_version}.jar, so the published
    // coordinate stays the bare version.
    archiveVersion = "${mod_version}-${minecraft_version}"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn 'classes', 'processResources'

    from(sourceSets.main.output) {
        include 'net/tunamods/customglint/common/**'
        include 'META-INF/accesstransformer.cfg'
        include 'custom_glint.mixins.json'
        include 'custom_glint.mixins.refmap.json'
        include 'assets/customglint/textures/glint/**'
        // Core shaders pair with the common/client rendering backend (glow outline post-process).
        include 'assets/customglint/shaders/**'
        include 'customglint.png'
        include 'pack.mcmeta'
    }

    def replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    from('src/main/resources/META-INF/mods.api.toml') {
        into 'META-INF'
        rename '.+', 'mods.toml'
        expand replaceProperties
    }

    manifest {
        attributes([
                'Specification-Title'     : 'customglint_api',
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : 'glint-and-glamour-api',
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'custom_glint.mixins.json'
        ])
    }
}

reobf {
    apiJar { }
}
apiJar.finalizedBy 'reobfApiJar'

// Stage the api jar into a directory the main jar can pull from, plus the metadata.json that
// Forge's jarJar runtime reads to register the nested mod.
tasks.register('stageApiInFullJar') {
    // Depend on reobfApiJar explicitly. apiJar.finalizedBy('reobfApiJar') doesn't establish a
    // happens-before for downstream consumers, so without this the staged copy may be grabbed
    // pre-reobf, leaving the nested api jar with named (e.g. onResourceManagerReload) instead
    // of SRG (m_6213_) method names, which crashes prod with AbstractMethodError.
    dependsOn 'apiJar', 'reobfApiJar'
    // Track the (reobfuscated) api jar as an input so this restages whenever its bytes change.
    // Without it the task declares outputs but no inputs, so Gradle marks it UP-TO-DATE as long
    // as the stage dir exists, meaning an api-source change rebuilds apiJar but the full jar keeps
    // bundling the PREVIOUS build's nested api jar (a NoSuchMethodError on any new api method).
    inputs.files(apiJar.archiveFile)
    inputs.property('apiJarName', apiJarName)
    inputs.property('modVersion', mod_version)
    def jarjarDir = file("${buildDir}/jarjar-stage/META-INF/jarjar")
    outputs.dir jarjarDir
    doLast {
        jarjarDir.mkdirs()
        copy {
            from apiJar.archiveFile
            into jarjarDir
            rename '.+', apiJarName
        }
        new File(jarjarDir, 'metadata.json').text = groovy.json.JsonOutput.prettyPrint("""{
  "jars": [
    {
      "identifier": { "group": "net.tunamods.customglint", "artifact": "glint-and-glamour-api" },
      "version": { "range": "[${mod_version},${(mod_version.tokenize(".")[0] as int) + 1}.0)", "artifactVersion": "${mod_version}" },
      "path": "META-INF/jarjar/${apiJarName}",
      "isObfuscated": false
    }
  ]
}""")
    }
}

tasks.named('jar', Jar).configure {
    dependsOn 'stageApiInFullJar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Tag the standalone download with the MC version so it doesn't collide with the 1.21.1 and 26.1.2
    // builds, which share the same mod_version. The nested api jar keeps the plain version (embedders
    // pin it by maven coordinate).
    archiveVersion = "${mod_version}-${minecraft_version}"

    // Api content lives inside the nested api jar only. Drop it from the full jar so classes
    // aren't loaded twice when a downstream mod's bundled jarJar copy also resolves.
    exclude 'net/tunamods/customglint/common/**'
    exclude 'META-INF/accesstransformer.cfg'
    exclude 'custom_glint.mixins.json'
    exclude 'custom_glint.mixins.refmap.json'
    exclude 'assets/customglint/textures/glint/**'
    exclude 'META-INF/mods.api.toml'
    exclude 'META-INF/mods.full.toml'
    // Replace the dev mods.toml (which declares both mods for runClient) with mods.full.toml
    // (only the customglint mod, declaring customglint_api as a hard dep, resolved at runtime
    // via the nested api jar in META-INF/jarjar/).
    exclude 'META-INF/mods.toml'

    def replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            // the api up to the next major version, so a x.0.0 release still accepts its own api
            api_next_major: (mod_version.tokenize(".")[0] as int) + 1,
    ]
    from('src/main/resources/META-INF/mods.full.toml') {
        into 'META-INF'
        rename '.+', 'mods.toml'
        expand replaceProperties
    }

    from "${buildDir}/jarjar-stage"

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'custom_glint.iceandfire.mixins.json,custom_glint.epicknights.mixins.json,custom_glint.sophisticatedbackpacks.mixins.json,custom_glint.elytraslot.mixins.json,custom_glint.epicfight.mixins.json,custom_glint.geckolib.mixins.json,custom_glint.immersivearmors.mixins.json,custom_glint.mekanism.mixins.json,custom_glint.artifacts.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'glint-and-glamour'
            artifact jar
        }
        register('mavenJavaApi', MavenPublication) {
            artifactId = 'glint-and-glamour-api'
            artifact apiJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // -AoutRefMapFile removed: MixinGradle now manages refmap output. Setting both conflicts and
    // produces a silent empty refmap (mappings: {}), which is what caused the prod-only
    // "Duplicate delegates" crash: @Shadow fixedBuffers couldn't resolve to f_110093_ in SRG.
}
